name: ci

# C-05 (tarea 2.5): jobs paralelos de backend y frontend, más E2E contra el backend real.
# NOTA: este workflow no se ejecutó localmente (no hay runner de GitHub Actions en el entorno de desarrollo).

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turnos
          POSTGRES_PASSWORD: turnos
          POSTGRES_DB: turnos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U turnos -d turnos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://turnos:turnos@localhost:5433/turnos
      TEST_DATABASE_URL: postgresql+asyncpg://turnos:turnos@localhost:5433/turnos
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrar la base
        run: alembic upgrade head
        env:
          JWT_SECRET_KEY: ci-synthetic-secret-not-for-production-use
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: frontend (tsc + lint + unit + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-paciente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-paciente/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (Playwright 360px contra backend real)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+asyncpg://turnos:turnos@localhost:5433/turnos
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-paciente/package-lock.json
      - name: Secreto JWT efímero (R17)
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: PostgreSQL por Docker Compose (healthcheck)
        run: docker compose up -d --wait postgres
      - name: Migrar la base
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
      - name: Backend por Docker Compose
        run: |
          docker compose up -d --build backend
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Dependencias del frontend y Chromium
        working-directory: frontend-paciente
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E
        working-directory: frontend-paciente
        run: npm run e2e
        env:
          CI: 'true'
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-paciente/playwright-report
            frontend-paciente/test-results
          retention-days: 7
      - name: Logs del backend
        if: failure()
        run: docker compose logs backend
