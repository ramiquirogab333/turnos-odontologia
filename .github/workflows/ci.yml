name: ci

# C-05 (tarea 2.5): jobs paralelos de backend y frontend, más E2E contra el backend real.
# NOTA: este workflow no se ejecutó localmente (no hay runner de GitHub Actions en el entorno de desarrollo).

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turnos
          POSTGRES_PASSWORD: turnos
          POSTGRES_DB: turnos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U turnos -d turnos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # C-15 (O17): el adaptador Redis del limitador se prueba contra un Redis real (no se salta en CI).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://turnos:turnos@localhost:5433/turnos
      TEST_DATABASE_URL: postgresql+asyncpg://turnos:turnos@localhost:5433/turnos
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: src
      # C-06: pasarela FALSA (sin red) y secreto de webhook SINTÉTICO; barrido apagado en los tests.
      APP_ENV: test
      MP_GATEWAY: fake
      MP_WEBHOOK_SECRET: ci-secreto-webhook-sintetico
      SENA_BARRIDO_HABILITADO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrar la base
        run: alembic upgrade head
        env:
          JWT_SECRET_KEY: ci-synthetic-secret-not-for-production-use
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: frontend (tsc + lint + unit + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/paciente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/paciente/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (Playwright 360px contra backend real)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+asyncpg://turnos:turnos@localhost:5433/turnos
      PYTHONPATH: src
      # C-06: el backend de Compose usa la pasarela falsa, permitida solo con APP_ENV=e2e; el E2E firma el webhook
      # con este mismo secreto SINTÉTICO (docker-compose.yml lo toma del entorno, sin default) y el barrido corre
      # cada 3 s para el caso de vencimiento.
      APP_ENV: e2e
      MP_GATEWAY: fake
      MP_WEBHOOK_SECRET: ci-secreto-webhook-sintetico
      E2E_MP_WEBHOOK_SECRET: ci-secreto-webhook-sintetico
      SENA_BARRIDO_SEGUNDOS: '3'
      # C-09: el barrido y los recordatorios corren en el worker (cada 3 s para los E2E).
      RECORDATORIOS_INTERVALO_SEGUNDOS: '3'
      # C-10: Google FALSO (servicio gcal-falso del perfil e2e de Compose): el consentimiento lo abre el navegador del
      # host (localhost:8090) y el backend/worker consultan gcal-falso:8090. Credenciales SINTÉTICAS; la clave de cifrado
      # se genera en el job (R17). El worker sincroniza cada 3 s.
      GCAL_CLIENT_ID: cliente-sintetico.apps.googleusercontent.com
      GCAL_CLIENT_SECRET: ci-secreto-gcal-sintetico
      GCAL_REDIRECT_URI: http://localhost:8000/api/panel/google-calendar/oauth/callback
      GCAL_OAUTH_BASE_URL: http://localhost:8090
      GCAL_TOKEN_BASE_URL: http://gcal-falso:8090
      GCAL_API_BASE_URL: http://gcal-falso:8090
      GCAL_SYNC_INTERVALO_SEGUNDOS: '3'
      E2E_GCAL_URL: http://localhost:8090
      # C-15 (O17): el E2E inicia sesión decenas de veces desde la misma IP; se suben los umbrales de IP y el par
      # IP + email queda en su default para que el E2E del bloqueo lo ejercite con un email propio.
      RATE_LIMIT_LOGIN_IP_MAX: '1000'
      RATE_LIMIT_REFRESH_IP_MAX: '1000'
      RATE_LIMIT_PUBLICO_ESCRITURA_MAX: '1000'
      RATE_LIMIT_PUBLICO_LECTURA_MAX: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/paciente/package-lock.json
      - name: Secreto JWT efímero (R17)
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Clave de cifrado de tokens efímera (R17, C-10)
        run: echo "GCAL_TOKEN_CLAVE=$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
      - name: PostgreSQL, Redis y Google falso por Docker Compose (healthcheck)
        run: docker compose --profile e2e up -d --build --wait postgres redis gcal-falso
      - name: Migrar la base
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
      - name: Backend y worker por Docker Compose
        run: |
          docker compose up -d --build backend worker
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker compose --profile e2e logs backend worker gcal-falso
          exit 1
      - name: Dependencias del frontend y Chromium
        working-directory: frontend/paciente
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E
        working-directory: frontend/paciente
        run: npm run e2e
        env:
          CI: 'true'
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/paciente/playwright-report
            frontend/paciente/test-results
          retention-days: 7
      - name: Logs del backend y del worker
        if: failure()
        run: docker compose --profile e2e logs backend worker gcal-falso

  # C-08 (D8): el panel interno tiene sus propios jobs, copia de los del frontend público.
  frontend-panel:
    name: frontend-panel (tsc + lint + unit + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e-panel:
    name: e2e-panel (Playwright 360px y 1280px contra backend real)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+asyncpg://turnos:turnos@localhost:5433/turnos
      PYTHONPATH: src
      # Pasarela falsa permitida solo con APP_ENV=e2e; secreto de webhook SINTÉTICO (docker-compose.yml lo toma del entorno).
      APP_ENV: e2e
      MP_GATEWAY: fake
      MP_WEBHOOK_SECRET: ci-secreto-webhook-sintetico
      SENA_BARRIDO_SEGUNDOS: '3'
      # C-09: el barrido y los recordatorios corren en el worker (cada 3 s para los E2E).
      RECORDATORIOS_INTERVALO_SEGUNDOS: '3'
      # C-10: Google FALSO (servicio gcal-falso del perfil e2e de Compose): el consentimiento lo abre el navegador del
      # host (localhost:8090) y el backend/worker consultan gcal-falso:8090. Credenciales SINTÉTICAS; la clave de cifrado
      # se genera en el job (R17). El worker sincroniza cada 3 s.
      GCAL_CLIENT_ID: cliente-sintetico.apps.googleusercontent.com
      GCAL_CLIENT_SECRET: ci-secreto-gcal-sintetico
      GCAL_REDIRECT_URI: http://localhost:8000/api/panel/google-calendar/oauth/callback
      GCAL_OAUTH_BASE_URL: http://localhost:8090
      GCAL_TOKEN_BASE_URL: http://gcal-falso:8090
      GCAL_API_BASE_URL: http://gcal-falso:8090
      GCAL_SYNC_INTERVALO_SEGUNDOS: '3'
      E2E_GCAL_URL: http://localhost:8090
      # C-15 (O17): el E2E inicia sesión decenas de veces desde la misma IP; se suben los umbrales de IP y el par
      # IP + email queda en su default para que el E2E del bloqueo lo ejercite con un email propio.
      RATE_LIMIT_LOGIN_IP_MAX: '1000'
      RATE_LIMIT_REFRESH_IP_MAX: '1000'
      RATE_LIMIT_PUBLICO_ESCRITURA_MAX: '1000'
      RATE_LIMIT_PUBLICO_LECTURA_MAX: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/panel/package-lock.json
      - name: Secreto JWT efímero (R17)
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Clave de cifrado de tokens efímera (R17, C-10)
        run: echo "GCAL_TOKEN_CLAVE=$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
      - name: PostgreSQL, Redis y Google falso por Docker Compose (healthcheck)
        run: docker compose --profile e2e up -d --build --wait postgres redis gcal-falso
      - name: Migrar la base
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
      - name: Backend y worker por Docker Compose
        run: |
          docker compose up -d --build backend worker
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker compose --profile e2e logs backend worker gcal-falso
          exit 1
      - name: Dependencias del panel y Chromium
        working-directory: frontend/panel
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E del panel
        working-directory: frontend/panel
        run: npm run e2e
        env:
          CI: 'true'
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-panel
          path: |
            frontend/panel/playwright-report
            frontend/panel/test-results
          retention-days: 7
      - name: Logs del backend y del worker
        if: failure()
        run: docker compose --profile e2e logs backend worker gcal-falso
