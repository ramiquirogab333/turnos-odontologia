services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos
      POSTGRES_DB: turnos
    ports:
      # Host 5433: un PostgreSQL nativo de Windows ya ocupa el 5432 del host.
      # Dentro de la red Compose el backend sigue usando postgres:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # C-09 (D1, R18): Redis lo usa el worker (arq) y, desde C-15, la API para los límites de solicitudes (fail-open).
  redis:
    image: redis:7-alpine
    ports:
      # Solo en loopback: sirve para correr los tests de integración del limitador desde el host; no se expone fuera.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # C-09 (D1): worker de trabajos programados (recordatorios y barrido de pre-reservas). Misma imagen del backend.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://turnos:turnos@postgres:5432/turnos
      REDIS_URL: redis://redis:6379/0
      APP_TZ: America/Argentina/Buenos_Aires
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      APP_ENV: ${APP_ENV:-production}
      MP_GATEWAY: ${MP_GATEWAY:-mercadopago}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?definí MP_WEBHOOK_SECRET en el entorno (no se commitea ningún secreto)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      SENA_BARRIDO_HABILITADO: ${SENA_BARRIDO_HABILITADO:-true}
      SENA_BARRIDO_SEGUNDOS: ${SENA_BARRIDO_SEGUNDOS:-60}
      RECORDATORIOS_HABILITADO: ${RECORDATORIOS_HABILITADO:-true}
      RECORDATORIOS_INTERVALO_SEGUNDOS: ${RECORDATORIOS_INTERVALO_SEGUNDOS:-300}
      REMINDER_LEAD_TIME: ${REMINDER_LEAD_TIME:-48}
      WHATSAPP_PROVEEDOR: ${WHATSAPP_PROVEEDOR:-manual}
      CLINICA_NOMBRE: ${CLINICA_NOMBRE:-la clínica}
      # C-10: Google Calendar. Sin credenciales el worker arranca igual y no registra gcal_sync (R17: nada en el repo).
      GCAL_CLIENT_ID: ${GCAL_CLIENT_ID:-}
      GCAL_CLIENT_SECRET: ${GCAL_CLIENT_SECRET:-}
      GCAL_TOKEN_CLAVE: ${GCAL_TOKEN_CLAVE:-}
      GCAL_REDIRECT_URI: ${GCAL_REDIRECT_URI:-http://localhost:8000/api/panel/google-calendar/oauth/callback}
      GCAL_SYNC_HABILITADO: ${GCAL_SYNC_HABILITADO:-true}
      GCAL_SYNC_INTERVALO_SEGUNDOS: ${GCAL_SYNC_INTERVALO_SEGUNDOS:-60}
      GCAL_HORIZONTE_DIAS: ${GCAL_HORIZONTE_DIAS:-60}
      PUBLIC_PANEL_URL: ${PUBLIC_PANEL_URL:-http://localhost:5174}
      GCAL_OAUTH_BASE_URL: ${GCAL_OAUTH_BASE_URL:-https://accounts.google.com}
      GCAL_TOKEN_BASE_URL: ${GCAL_TOKEN_BASE_URL:-https://oauth2.googleapis.com}
      GCAL_API_BASE_URL: ${GCAL_API_BASE_URL:-https://www.googleapis.com}
      # C-15 (D8): purga de sesiones vencidas del panel.
      PURGA_SESIONES_HABILITADO: ${PURGA_SESIONES_HABILITADO:-true}
      PURGA_SESIONES_INTERVALO_SEGUNDOS: ${PURGA_SESIONES_INTERVALO_SEGUNDOS:-3600}
      PURGA_SESIONES_MARGEN_MINUTOS: ${PURGA_SESIONES_MARGEN_MINUTOS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "app.jobs.worker.WorkerSettings"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://turnos:turnos@postgres:5432/turnos
      APP_TZ: America/Argentina/Buenos_Aires
      # R17: el secreto JWT llega por variable de entorno del host (nunca en el repo).
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      # C-06 (R17): pasarela de pagos. Todo viene del entorno del host; nunca se commitea un .env (R20) ni un
      # secreto por defecto. Los defaults son los SEGUROS: producción con Mercado Pago real, así que sin
      # MP_ACCESS_TOKEN el backend no arranca. La pasarela falsa solo se acepta con APP_ENV=test o APP_ENV=e2e
      # (tests, CI y E2E exportan esos valores). MP_WEBHOOK_SECRET es obligatoria: sin ella `docker compose`
      # falla con un mensaje claro (para solo Postgres basta exportar un valor cualquiera).
      APP_ENV: ${APP_ENV:-production}
      MP_GATEWAY: ${MP_GATEWAY:-mercadopago}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?definí MP_WEBHOOK_SECRET en el entorno (no se commitea ningún secreto)}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8000}
      # Barrido de pre-reservas vencidas (C-06 D8). Desde C-09 (O11) lo corre el worker; la API solo lo hace con
      # SENA_BARRIDO_EN_API=true (desarrollo sin Redis). Para los E2E de vencimiento conviene SENA_BARRIDO_SEGUNDOS=3.
      SENA_BARRIDO_HABILITADO: ${SENA_BARRIDO_HABILITADO:-true}
      SENA_BARRIDO_SEGUNDOS: ${SENA_BARRIDO_SEGUNDOS:-60}
      SENA_BARRIDO_EN_API: ${SENA_BARRIDO_EN_API:-false}
      # C-09: la API arma el link de WhatsApp del panel con estos datos (no usa Redis).
      REMINDER_LEAD_TIME: ${REMINDER_LEAD_TIME:-48}
      WHATSAPP_PROVEEDOR: ${WHATSAPP_PROVEEDOR:-manual}
      CLINICA_NOMBRE: ${CLINICA_NOMBRE:-la clínica}
      # C-08 (O14): minutos tras el inicio desde los que recepción puede marcar un turno como ausente.
      AUSENTE_TOLERANCIA_MINUTOS: ${AUSENTE_TOLERANCIA_MINUTOS:-10}
      # C-10: Google Calendar. Sin credenciales el worker arranca igual y no registra gcal_sync (R17: nada en el repo).
      GCAL_CLIENT_ID: ${GCAL_CLIENT_ID:-}
      GCAL_CLIENT_SECRET: ${GCAL_CLIENT_SECRET:-}
      GCAL_TOKEN_CLAVE: ${GCAL_TOKEN_CLAVE:-}
      GCAL_REDIRECT_URI: ${GCAL_REDIRECT_URI:-http://localhost:8000/api/panel/google-calendar/oauth/callback}
      GCAL_SYNC_HABILITADO: ${GCAL_SYNC_HABILITADO:-true}
      GCAL_SYNC_INTERVALO_SEGUNDOS: ${GCAL_SYNC_INTERVALO_SEGUNDOS:-60}
      GCAL_HORIZONTE_DIAS: ${GCAL_HORIZONTE_DIAS:-60}
      PUBLIC_PANEL_URL: ${PUBLIC_PANEL_URL:-http://localhost:5174}
      GCAL_OAUTH_BASE_URL: ${GCAL_OAUTH_BASE_URL:-https://accounts.google.com}
      GCAL_TOKEN_BASE_URL: ${GCAL_TOKEN_BASE_URL:-https://oauth2.googleapis.com}
      GCAL_API_BASE_URL: ${GCAL_API_BASE_URL:-https://www.googleapis.com}
      # C-15: sesión del panel, límites de solicitudes (Redis) e IP real detrás de un proxy. Sin secretos (R17).
      REDIS_URL: redis://redis:6379/0
      SESION_MAXIMA_HORAS: ${SESION_MAXIMA_HORAS:-12}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_TIMEOUT_MS: ${RATE_LIMIT_TIMEOUT_MS:-200}
      RATE_LIMIT_LOGIN_IP_EMAIL_MAX: ${RATE_LIMIT_LOGIN_IP_EMAIL_MAX:-5}
      RATE_LIMIT_LOGIN_IP_EMAIL_VENTANA_SEG: ${RATE_LIMIT_LOGIN_IP_EMAIL_VENTANA_SEG:-900}
      RATE_LIMIT_LOGIN_IP_MAX: ${RATE_LIMIT_LOGIN_IP_MAX:-30}
      RATE_LIMIT_LOGIN_IP_VENTANA_SEG: ${RATE_LIMIT_LOGIN_IP_VENTANA_SEG:-900}
      RATE_LIMIT_LOGIN_EMAIL_MAX: ${RATE_LIMIT_LOGIN_EMAIL_MAX:-20}
      RATE_LIMIT_LOGIN_EMAIL_VENTANA_SEG: ${RATE_LIMIT_LOGIN_EMAIL_VENTANA_SEG:-3600}
      RATE_LIMIT_REFRESH_IP_MAX: ${RATE_LIMIT_REFRESH_IP_MAX:-60}
      RATE_LIMIT_REFRESH_IP_VENTANA_SEG: ${RATE_LIMIT_REFRESH_IP_VENTANA_SEG:-900}
      RATE_LIMIT_PUBLICO_ESCRITURA_MAX: ${RATE_LIMIT_PUBLICO_ESCRITURA_MAX:-10}
      RATE_LIMIT_PUBLICO_ESCRITURA_VENTANA_SEG: ${RATE_LIMIT_PUBLICO_ESCRITURA_VENTANA_SEG:-600}
      RATE_LIMIT_PUBLICO_LECTURA_MAX: ${RATE_LIMIT_PUBLICO_LECTURA_MAX:-120}
      RATE_LIMIT_PUBLICO_LECTURA_VENTANA_SEG: ${RATE_LIMIT_PUBLICO_LECTURA_VENTANA_SEG:-60}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # C-10 (D11, O15): servidor falso de Google (OAuth + Calendar) SOLO para los E2E: perfil `e2e`, nunca arranca con
  # `docker compose up` a secas ni con APP_ENV distinto de e2e. El consentimiento lo abre el navegador del host
  # (localhost:8090); el backend y el worker lo consultan por la red de Compose (gcal-falso:8090).
  gcal-falso:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.integraciones.gcal.servidor_falso:crear_app", "--factory", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      APP_ENV: e2e
      MP_GATEWAY: fake
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
